# Deploy apps/marketing (Astro, static) to Cloudflare Pages on every push to
# main that touches it.
#
# Until now the marketing site was deployed by hand with `wrangler pages
# deploy`, which meant a merged content fix sat unpublished until somebody
# remembered. This does the same command from CI. It is the same artefact the
# manual path produces: `astro build` plus scripts/generate-agent-files.mjs,
# uploaded from apps/marketing/dist.
#
# Dormant until two repository secrets exist (Settings > Secrets and variables
# > Actions). Without them the job says so and exits clean rather than failing
# on every push:
#
#   CLOUDFLARE_API_TOKEN   an API token with the "Cloudflare Pages: Edit"
#                          permission on the account. Nothing else.
#   CLOUDFLARE_ACCOUNT_ID  the account id shown in the Cloudflare dashboard URL.
#
# Optional repository variable:
#
#   CF_PAGES_PROJECT       the Pages project name. Defaults to "altorank".
#
# `--branch main` is passed explicitly. Wrangler otherwise infers the branch
# from git, and a deploy whose branch is not the project's production branch
# lands as a preview URL, not on the live site. The project's production
# branch is `main`, not `master`.
#
# Nothing here interpolates event data (branch names, commit messages) into a
# shell, which is the usual injection route in Actions.

name: Deploy marketing

on:
  push:
    branches: [main]
    paths:
      - "apps/marketing/**"
      - "package-lock.json"
      - ".github/workflows/deploy-marketing.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a newer push waits rather than racing an older one.
concurrency:
  group: deploy-marketing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build:marketing

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT || 'altorank' }}
        run: |
          set -euo pipefail

          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "CLOUDFLARE_API_TOKEN and/or CLOUDFLARE_ACCOUNT_ID are not set for this repository."
            echo "Add both under Settings > Secrets and variables > Actions to arm this workflow."
            echo "Until then the marketing site is deployed by hand (see docs/deploy.md)."
            exit 0
          fi

          npx --yes wrangler@4 pages deploy apps/marketing/dist \
            --project-name "${CF_PAGES_PROJECT}" \
            --branch main

# Hourly runs of the publisher.
#
# Why this is not in vercel.json: the Vercel account is on Hobby, which rejects
# any cron expression that fires more than once a day. Vercel runs
# /api/cron/publish once at 09:00 UTC; a site whose publish time is later than
# that in its own timezone (12:00 in Rome, say) would otherwise never be
# reached, because the cadence gate is "at or after publish_time" and there is
# no later run to satisfy it.
#
# Same endpoint, same secret, so there is no second code path. The publisher
# is idempotent per local day ("already published today"), so extra runs cost
# a lookup per cadence and never a second article.
#
# Dormant until CRON_SECRET is set as a repository secret.

name: Publish scheduled articles

on:
  schedule:
    # Every hour except 09 UTC, which Vercel already covers.
    - cron: "0 0-8,10-23 * * *"
  workflow_dispatch:

concurrency:
  group: publish-cron
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger publishing
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # A fork sets the APP_URL repository variable to its own deployment.
          # The hosted URL is the default only in AltoRank/altorank itself.
          APP_URL: ${{ vars.APP_URL }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not set for this repository."
            echo "Add it under Settings > Secrets and variables > Actions to arm this schedule."
            echo "Until then Vercel's 09:00 UTC run is the only one."
            exit 0
          fi

          if [ -z "${APP_URL}" ]; then
            if [ "${REPOSITORY}" != "AltoRank/altorank" ]; then
              # Never send this repository's CRON_SECRET to someone else's server.
              echo "APP_URL is not set for this repository."
              echo "Add it under Settings > Secrets and variables > Actions > Variables, set to your deployment's origin."
              exit 0
            fi
            APP_URL="https://app.altorank.co"
          fi

          # The response body names customer sites and this repository is public,
          # so its Actions logs are too. The body goes to a temp file that is
          # never printed; the log gets the status code and counts only. For
          # the full body, run the curl in docs/deploy.md by hand.
          body="${RUNNER_TEMP}/response.json"
          set +e
          code=$(curl --silent --output "${body}" \
            --max-time 300 \
            --header "x-cron-secret: ${CRON_SECRET}" \
            --write-out '%{http_code}' \
            "${APP_URL}/api/cron/publish")
          rc=$?
          set -e

          echo "HTTP ${code}"
          if [ "${rc}" -ne 0 ]; then
            echo "error=curl_exit_${rc}"
            exit 1
          fi
          case "${code}" in
            2??) ;;
            *)
              echo "error=http_${code}"
              exit 1
              ;;
          esac

          # Allow-listed aggregates only. Anything that is a list is printed as
          # its length; a sub-step that failed prints "failed", not its message.
          jq -r '
            def count:
              if type == "array" then length
              elif type == "number" then .
              elif type == "object" and has("error") then "failed"
              else "n/a" end;
            "published=\(.published|count) errors=\(.errors|count) results=\(.results|count)",
            "verified confirmed=\(.verified.confirmed|count) stillPending=\(.verified.stillPending|count) unconfirmed=\(.verified.unconfirmed|count)",
            "autoApprovals=\(.autoApprovals|count) heldDigests=\(.heldDigests|count)"
          ' "${body}" 2>/dev/null || echo "response was not JSON"

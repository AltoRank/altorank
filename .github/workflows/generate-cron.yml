# Extra runs of the article generator.
#
# Why this is not in vercel.json: the Vercel account is on Hobby, which rejects
# any cron expression that would fire more than once a day - the deployment
# fails outright, which is how this file came to exist. Vercel still runs
# /api/cron/generate once daily; this adds three more runs so a site can reach
# the 100 articles a month the plan sells.
#
# The endpoint is the same one Vercel calls and authenticates the same way, so
# there is no second code path to keep in step. Each run is capped and every
# workspace's weekly limit and the account quota still apply, so a run that has
# nothing to do costs nothing.
#
# Dormant until CRON_SECRET is set as a repository secret; without it the job
# reports that and exits clean rather than failing four times a day.

name: Generate articles

on:
  schedule:
    # 01/13/19 UTC. Not 07 - Vercel already runs that one, and two schedulers
    # firing the same endpoint on the same hour is one wasted invocation, not
    # two articles. GitHub runs scheduled jobs on a best-effort basis and can be
    # late under load, which is fine: the generator is bounded by each
    # workspace's weekly limit, not by landing on the hour.
    - cron: "0 1,13,19 * * *"
  workflow_dispatch:

# Never let a delayed run pile up on top of a running one.
concurrency:
  group: generate-cron
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Trigger generation
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # A fork sets the APP_URL repository variable to its own deployment.
          # The hosted URL is the default only in AltoRank/altorank itself.
          APP_URL: ${{ vars.APP_URL }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET}" ]; then
            echo "CRON_SECRET is not set for this repository."
            echo "Add it under Settings > Secrets and variables > Actions to arm this schedule."
            echo "Until then Vercel's once-daily run is the only one, and nothing here has changed."
            exit 0
          fi

          if [ -z "${APP_URL}" ]; then
            if [ "${REPOSITORY}" != "AltoRank/altorank" ]; then
              # Never send this repository's CRON_SECRET to someone else's server.
              echo "APP_URL is not set for this repository."
              echo "Add it under Settings > Secrets and variables > Actions > Variables, set to your deployment's origin."
              exit 0
            fi
            APP_URL="https://app.altorank.co"
          fi

          # The response body names customer sites and this repository is public,
          # so its Actions logs are too. The body goes to a temp file that is
          # never printed; the log gets the status code and counts only. For
          # the full body, run the curl in docs/deploy.md by hand.
          body="${RUNNER_TEMP}/response.json"
          set +e
          code=$(curl --silent --output "${body}" \
            --max-time 300 \
            --header "x-cron-secret: ${CRON_SECRET}" \
            --write-out '%{http_code}' \
            "${APP_URL}/api/cron/generate")
          rc=$?
          set -e

          echo "HTTP ${code}"
          if [ "${rc}" -ne 0 ]; then
            echo "error=curl_exit_${rc}"
            exit 1
          fi
          case "${code}" in
            2??) ;;
            *)
              echo "error=http_${code}"
              exit 1
              ;;
          esac

          # Allow-listed aggregates only. Anything that is a list is printed as
          # its length; a sub-step that failed prints "failed", not its message.
          jq -r '
            def count:
              if type == "array" then length
              elif type == "number" then .
              elif type == "object" and has("error") then "failed"
              else "n/a" end;
            "checked=\(.checked|count) generated=\(.generated|count) skipped=\(.skipped|count) errors=\(.errors|count) results=\(.results|count)",
            "pausesResumed=\(.pausesResumed|count) pauseReminders=\(.pauseReminders|count) pausedNotices=\(.pausedNotices|count) setupNotices=\(.setupNotices|count) unannounced=\(.unannounced|count)",
            "owedBodies dispatched=\(.owedBodies.dispatched|count) gaveUp=\(.owedBodies.gaveUp|count)"
          ' "${body}" 2>/dev/null || echo "response was not JSON"

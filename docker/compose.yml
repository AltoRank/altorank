# Self-hosted AltoRank dashboard.
#
# This runs the app. It does NOT run the database, deliberately.
#
# Every data path in apps/web goes through Supabase (13 of 13 query modules call
# createClient directly; there is no storage abstraction yet). Supabase is itself
# open source, and its CLI brings up the whole backend in one command, so the
# honest self-host story today is "bring your own Supabase, we ship the app".
#
# Two supported shapes:
#
#   Local, fully self-hosted and free:
#     cd apps/web && supabase start        # postgres, auth, storage, studio
#     supabase db push                     # apply the migrations, in order
#     # take the API URL and anon key it prints, put them in docker/.env
#     docker compose -f docker/compose.yml up --build
#
#   Against a hosted Supabase project:
#     put that project's URL and anon key in docker/.env, then the same up.
#
# A single-container SQLite build with no Postgres at all is the eventual goal
# and is blocked on the ContentStore port (pivot plan, Phase 1). Claiming it
# before that port exists would be a feature grep disproves.

services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        # Inlined into the client bundle at build time, so they are build args
        # rather than runtime env. The anon key is public by design.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set it in docker/.env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set it in docker/.env}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Server-side only. Everything except the Anthropic key is optional and
      # degrades rather than crashing.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      # Compared against the x-cron-secret header by every /api/cron/* route.
      # It was documented in .env.example but never reached the container, so
      # the routes rejected every request even when it was set.
      CRON_SECRET: ${CRON_SECRET:-}
      DATAFORSEO_API_KEY: ${DATAFORSEO_API_KEY:-}
      PAGESPEED_API_KEY: ${PAGESPEED_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      FEEDBACK_EMAIL: ${FEEDBACK_EMAIL:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:-}
      STRIPE_PRICE_STARTER_YEARLY: ${STRIPE_PRICE_STARTER_YEARLY:-}
      STRIPE_PRICE_GROWTH: ${STRIPE_PRICE_GROWTH:-}
      STRIPE_PRICE_GROWTH_YEARLY: ${STRIPE_PRICE_GROWTH_YEARLY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_MODEL_STRUCTURED: ${ANTHROPIC_MODEL_STRUCTURED:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Runs the nine scheduled jobs that the hosted deployment gets from Vercel.
  #
  # Without this, self-hosting shipped the dashboard but not the automation,
  # which is the part the product is actually about: analysis, drafting, rank
  # tracking and AI-visibility measurement only ever ran if somebody clicked.
  # The routes existed in the app container and nothing called them.
  #
  # A separate container rather than a background process inside `web`, so a
  # crashed scheduler shows up as a stopped container instead of a silently
  # missing loop, and so scaling the app does not multiply the schedule.
  cron:
    image: alpine:3.20
    depends_on:
      - web
    environment:
      APP_URL: http://web:3000
      # Required, not optional. Every /api/cron/* route rejects a request without
      # a matching x-cron-secret, so a scheduler started without this would run
      # on time and accomplish nothing, which is the hardest failure to notice.
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in docker/.env; the cron routes reject every request without it}
    volumes:
      - ./crontab:/etc/altorank/crontab:ro
      - ./cron-entrypoint.sh:/usr/local/bin/cron-entrypoint.sh:ro
    command: sh -c "apk add --no-cache curl >/dev/null && exec /usr/local/bin/cron-entrypoint.sh"
    restart: unless-stopped
